name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/code-quality.yml
  build:
    needs: quality
    uses: ./.github/workflows/build-and-test.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
  staging:
    needs: build
    if: vars.CLOUD_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/deploy-staging.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      run_id: ${{ format('{0}', github.run_id) }}
  production:
    needs: staging
    uses: ./.github/workflows/deploy-production.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      run_id: ${{ format('{0}', github.run_id) }}
