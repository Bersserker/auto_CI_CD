name: Release operation
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      run_id:
        type: string
        default: ''
      staging_run_id:
        type: string
        default: ''
      mode:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: vars.CLOUD_DEPLOY_ENABLED == 'true'
    environment:
      name: ${{ inputs.environment }}
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 50
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      RELEASE_ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_MODE: ${{ inputs.mode }}
      STAGING_RUN_ID: ${{ inputs.staging_run_id || inputs.run_id }}
      RELEASE_RUN_ID: ${{ inputs.run_id }}
      ALLOW_INITIAL_DEPLOY: ${{ vars.ALLOW_INITIAL_DEPLOY }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      REGISTRY_PULL_SECRET: ${{ vars.REGISTRY_PULL_SECRET }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Temporary credential and artifact paths
        run: |
          echo "RELEASE_FILE=$RUNNER_TEMP/release.json" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$RUNNER_TEMP/mlops-kubeconfig" >> "$GITHUB_ENV"
          echo "RELEASE_EVIDENCE=$RUNNER_TEMP/release-evidence.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'PyYAML==6.0.3'
      - name: Fetch and verify release provenance
        id: release
        if: inputs.mode != 'rollback'
        run: python scripts/ci/fetch_release.py
      - uses: actions/checkout@v4
        if: inputs.mode != 'rollback'
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - name: Require successful staging before production
        if: inputs.environment == 'production' && inputs.mode != 'rollback'
        run: python scripts/ci/fetch_staging_receipt.py
      - name: Install Kubernetes tools
        run: bash scripts/ci/install_tools.sh
      - name: Configure cluster access
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: python scripts/ci/configure_cluster.py
      - name: Supply model storage credentials
        if: inputs.mode != 'rollback'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          kubectl create namespace mlops --dry-run=client -o yaml | kubectl apply -f -
          python scripts/create_kubernetes_secret.py --context "$(kubectl config current-context)"
      - name: Deploy, monitor and recover on failure
        run: python -m scripts.ci.istio_delivery --context "$(kubectl config current-context)"
      - name: Staging promotion receipt
        if: inputs.environment == 'staging' && inputs.mode != 'rollback'
        run: |
          mkdir -p promotion
          cp "$RELEASE_FILE" promotion/receipt.json
      - uses: actions/upload-artifact@v4
        if: inputs.environment == 'staging' && inputs.mode != 'rollback'
        with:
          name: deployed-staging-${{ inputs.run_id }}
          path: promotion/receipt.json
          retention-days: 30
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove cluster credentials
        if: always()
        run: rm -f -- "$KUBECONFIG"
