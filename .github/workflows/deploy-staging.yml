name: Deploy staging
on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI run ID with a release artifact (same repository, default branch)'
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    if: vars.CLOUD_DEPLOY_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: staging
      run_id: ${{ inputs.run_id }}
      mode: blue-green
