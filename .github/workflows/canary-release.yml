name: Canary release
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
      run_id:
        description: 'CI run ID with the candidate release'
        type: string
        required: true
      staging_run_id:
        description: 'Staging workflow run ID; empty means the source CI run'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  canary:
    if: vars.CLOUD_DEPLOY_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      run_id: ${{ inputs.run_id }}
      staging_run_id: ${{ inputs.staging_run_id }}
      mode: canary
