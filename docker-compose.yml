services:
  app:
    build:
      context: .                 # папка, где лежит Dockerfile
      dockerfile: Dockerfile     # имя файла (можно не указывать, если это Dockerfile)
    container_name: my-default-payment-app
    ports:
      - "8000:8000"              # хост:контейнер
    volumes:
      - ./models:/app/models:ro
    environment:
      DVC_PULL: "0"
      MODEL_BACKEND: onnx
      MODEL_VERSION: ${MODEL_VERSION:-onnx-local}
    restart: unless-stopped     # автоперезапуск при падении или рестарте хоста

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://app:8000
    depends_on:
      - app
    restart: unless-stopped
