rule_files:
- alerts.yml
evaluation_interval: 15s
tests:
- interval: 15s
  input_series:
  - series: up{job="scoring",instance="app:8000"}
    values: '0x12'
  alert_rule_test:
  - eval_time: 45s
    alertname: ScoringDown
    exp_alerts: []
  - eval_time: 75s
    alertname: ScoringDown
    exp_alerts:
    - exp_labels:
        job: scoring
        instance: app:8000
        severity: critical
      exp_annotations:
        summary: API недоступен
        runbook_url: monitoring/RUNBOOK.md#scoringdown
- interval: 15s
  input_series:
  - series: up{job="scoring",instance="app:8000"}
    values: 0x5 1x12
  alert_rule_test:
  - eval_time: 2m
    alertname: ScoringDown
    exp_alerts: []
- interval: 15s
  input_series:
  - series: http_requests_total{handler="/predict",status="5xx"}
    values: 0+15x40
  alert_rule_test:
  - eval_time: 6m
    alertname: ScoringErrors
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: Ошибки predict превышают 5%
        runbook_url: monitoring/RUNBOOK.md#scoringerrors
- interval: 15s
  input_series:
  - series: scoring_inference_duration_seconds_bucket{le="0.5"}
    values: '0x40'
  - series: scoring_inference_duration_seconds_bucket{le="1.0"}
    values: 0+15x40
  - series: scoring_inference_duration_seconds_bucket{le="+Inf"}
    values: 0+15x40
  alert_rule_test:
  - eval_time: 6m
    alertname: ScoringLatency
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: p95 predict превышает 500 мс
        runbook_url: monitoring/RUNBOOK.md#scoringlatency
- interval: 15s
  input_series:
  - series: node_memory_MemAvailable_bytes{instance="node"}
    values: 1x40
  - series: node_memory_MemTotal_bytes{instance="node"}
    values: 100x40
  alert_rule_test:
  - eval_time: 6m
    alertname: HostMemoryHigh
    exp_alerts:
    - exp_labels:
        instance: node
        severity: warning
      exp_annotations:
        summary: Свободно менее 10% RAM
        runbook_url: monitoring/RUNBOOK.md#hostmemoryhigh
- interval: 15s
  input_series:
  - series: node_filesystem_avail_bytes{instance="node",fstype="ext4",mountpoint="/"}
    values: 1x40
  - series: node_filesystem_size_bytes{instance="node",fstype="ext4",mountpoint="/"}
    values: 100x40
  alert_rule_test:
  - eval_time: 6m
    alertname: HostDiskLow
    exp_alerts:
    - exp_labels:
        instance: node
        fstype: ext4
        mountpoint: /
        severity: warning
      exp_annotations:
        summary: Свободно менее 10% диска
        runbook_url: monitoring/RUNBOOK.md#hostdisklow
- interval: 15s
  input_series:
  - series: up{job="loki",instance="loki:3100"}
    values: '0x40'
  alert_rule_test:
  - eval_time: 6m
    alertname: MonitoringTargetDown
    exp_alerts:
    - exp_labels:
        job: loki
        instance: loki:3100
        severity: warning
      exp_annotations:
        summary: Недоступен компонент мониторинга
        runbook_url: monitoring/RUNBOOK.md#monitoringtargetdown
