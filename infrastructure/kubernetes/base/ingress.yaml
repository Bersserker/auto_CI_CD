apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: credit-scoring
spec:
  ingressClassName: traefik
  rules:
    - host: credit.local
      http:
        paths:
          - path: /predict
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
