services:
  scheduler:
    image: seldonio/seldon-scheduler:2.10.0
    command: [--log-level, info, --db-path, /db, --scheduler-ready-timeout-seconds, "30", --kafka-config-path, /config/kafka.json, --enable-model-autoscaling=false, --enable-server-autoscaling=false, --scaling-config-path, /config/scaling.json, --tracing-config-path, /config/tracing.json]
    ports: ["127.0.0.1:19004:9004"]
    volumes:
      - scheduler-data:/db
      - ./infrastructure/seldon:/config:ro
  envoy:
    image: seldonio/seldon-envoy:2.10.0
    command: [/usr/local/bin/envoy, -c, /config/envoy.yaml]
    volumes: ["./infrastructure/seldon:/config:ro"]
    ports: ["127.0.0.1:19000:9000"]
  rclone:
    image: seldonio/seldon-rclone:2.10.0
    command: [rcd, --rc-no-auth, --rc-addr=0.0.0.0:5572]
    volumes:
      - model-cache:/mnt/agent
      - ./artifacts/stage6/repository:/repository:ro
  agent:
    image: seldonio/seldon-agent:2.10.0
    command: [--log-level, info, --config-path, /config, --rclone-host, rclone, --inference-host, mlserver, --agent-host, agent, --server-name, mlserver, --tracing-config-path, /config/tracing.json]
    environment:
      SELDON_SCHEDULER_HOST: scheduler
      SELDON_SCHEDULER_PORT: "9005"
      SELDON_SERVER_TYPE: mlserver
      SELDON_SERVER_CAPABILITIES: mlserver,onnx
      SELDON_SERVER_HTTP_PORT: "8080"
      SELDON_SERVER_GRPC_PORT: "8081"
      SELDON_REVERSE_PROXY_HTTP_PORT: "9999"
      SELDON_REVERSE_PROXY_GRPC_PORT: "9998"
      SELDON_ENVOY_HOST: envoy
      SELDON_ENVOY_PORT: "9000"
      MEMORY_REQUEST: "1000000000"
    volumes:
      - model-cache:/mnt/agent
      - ./infrastructure/seldon:/config:ro
  mlserver:
    environment:
      MLSERVER_PARALLEL_WORKERS: "0"
      OMP_NUM_THREADS: "1"
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    build: {context: ., dockerfile: docker/seldon/Dockerfile}
    volumes: ["model-cache:/mnt/agent"]
  gateway:
    image: credit-backend:observability
    entrypoint: [uvicorn, src.model_management.gateway:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      SELDON_URL: http://envoy:9000
      JOURNAL_PATH: /records/predictions.jsonl
    volumes:
      - ./src:/app/src:ro
      - ./models:/app/models:ro
      - ./artifacts/stage6/records:/records
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports: ["127.0.0.1:18080:8000"]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://localhost:8000/live')"]
  drift-reports:
    image: credit-backend:observability
    entrypoint: [python, -m, src.monitoring.drift_exporter]
    volumes:
      - ./src:/app/src:ro
      - ./artifacts/stage6/drift:/app/artifacts/stage6/drift:ro
    ports: ["127.0.0.1:18081:8001"]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://localhost:8001/')"]
volumes:
  scheduler-data:
  model-cache:
