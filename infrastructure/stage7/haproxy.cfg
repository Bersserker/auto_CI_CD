global
  maxconn 512
defaults
  mode http
  timeout connect 1s
  timeout client 30s
  timeout server 30s
  retries 2
  option redispatch
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s
frontend scoring
  bind *:8000
  default_backend replicas
backend replicas
  balance roundrobin
  option httpchk GET /ready
  http-check expect status 200
  server-template site-a 1-6 site-a:8000 check inter 1s fall 2 rise 1 resolvers docker init-addr none
  server-template site-b 1-2 site-b:8000 check inter 1s fall 2 rise 1 resolvers docker init-addr none backup
