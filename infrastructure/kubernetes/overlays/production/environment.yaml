apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  DVC_REMOTE_URL: s3://REPLACE_PRODUCTION_ARTIFACTS_BUCKET/dvc
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: credit-scoring
spec:
  tls:
    - hosts: [REPLACE_PRODUCTION_DOMAIN]
      secretName: credit-tls
  rules:
    - host: REPLACE_PRODUCTION_DOMAIN
      http:
        paths:
          - path: /predict
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 3
