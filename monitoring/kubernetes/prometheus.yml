global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- /etc/rules/alerts.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
scrape_configs:
- job_name: scoring
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - mlops
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app
    regex: backend
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_number
    regex: '8000'
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
- job_name: node
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - monitoring
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app
    regex: node-exporter
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_number
    regex: '9100'
    action: keep
- job_name: cadvisor
  scheme: https
  authorization:
    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  kubernetes_sd_configs:
  - role: node
  relabel_configs:
  - target_label: __address__
    replacement: kubernetes.default.svc:443
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: __metrics_path__
    replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: instance
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: loki
  static_configs:
  - targets:
    - loki:3100
- job_name: alertmanager
  static_configs:
  - targets:
    - alertmanager:9093
