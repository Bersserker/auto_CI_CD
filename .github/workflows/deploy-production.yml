name: Deploy production
on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      staging_run_id:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI run ID with a release artifact (same repository, default branch)'
        type: string
        required: true
      staging_run_id:
        description: 'Staging workflow run ID; empty means the source CI run'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    if: vars.CLOUD_DEPLOY_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: production
      run_id: ${{ inputs.run_id }}
      staging_run_id: ${{ inputs.staging_run_id }}
      mode: blue-green
