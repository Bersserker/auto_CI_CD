name: Rollback
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
  actions: read
jobs:
  rollback:
    if: vars.CLOUD_DEPLOY_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      mode: rollback
