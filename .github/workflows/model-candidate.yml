name: Verify model candidate
on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Immutable candidate run ID from Airflow delivery.json
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    if: vars.MODEL_CANDIDATES_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked
      - name: Fetch and verify trusted candidate bundle
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          MODEL_CANDIDATE_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          MODEL_S3_ENDPOINT: https://storage.yandexcloud.net
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: uv run --no-sync python -m scripts.stage7_candidate --run-id "$CANDIDATE_ID" --fetch
      - name: Build base backend
        run: |
          docker build -t credit-backend:observability .
          docker build -f docker/stage7/Dockerfile -t credit-backend:stage7 .
      - name: Build gated candidate image
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: uv run --no-sync python -m scripts.stage7_candidate --run-id "$CANDIDATE_ID" --build
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: credit-backend:candidate-${{ inputs.candidate_id }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Preserve verified handoff
        uses: actions/upload-artifact@v4
        with:
          name: verified-model-candidate
          path: |
            artifacts/stage7/runs/${{ inputs.candidate_id }}/delivery.json
            artifacts/stage7/runs/${{ inputs.candidate_id }}/candidate.tar.gz
          if-no-files-found: error
# Images stay candidates. Existing stage-4 deploy/security/rollback policy must
# approve and publish an immutable digest before staging/production delivery.
